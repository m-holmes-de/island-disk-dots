# Rose Pine Hyprlock Configuration
# Simple and beautiful lock screen

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# Rose Pine color palette
# base = #191724
# surface = #1f1d2e
# overlay = #26233a
# muted = #6e6a86
# subtle = #908caa
# text = #e0def4
# love = #eb6f92
# gold = #f6c177
# rose = #ebbcba
# pine = #31748f
# foam = #9ccfd8
# iris = #c4a7e7

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%H:%M')</span>"
    color = rgba(224, 222, 244, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%A, %d %B')</span>"
    color = rgba(156, 207, 216, 0.8)
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =     $USER
    color = rgba(144, 140, 170, 0.8)
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(49, 116, 143, 0.8)
    inner_color = rgba(31, 29, 46, 0.8)
    font_color = rgba(224, 222, 244, 1.0)
    fade_on_empty = false
    rounding = 10
    check_color = rgba(235, 188, 186, 1.0)
    fail_color = rgba(235, 111, 146, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
    placeholder_text = <span foreground="##908caa">Enter Password...</span>
}
