# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
unbind = SUPER, M, Music, exec, uwsm app -- spotify
bindd = SUPER, S, Music, exec, uwsm app -- spotify

# Close window
unbind = SUPER, W
bindd = SUPER, Q, Close active window, killactive,

# Control tiling
# bindd = SUPER, J, Toggle split, togglesplit, # dwindle
unbind = SUPER, L
unbind = SUPER, H
unbind = SUPER, K
bindd = SUPER SHIFT, E, Show Keybindings, exec, omarchy-menu-keybindings
unbind = SUPER, J
bindd = SUPER, P, Pseudo window, pseudo, # dwindle
bindd = SUPER, V, Toggle floating, togglefloating,
unbind = SHIFT, F11, Force full screen, fullscreen, 0
bindd = SUPER, M, Force full screen, fullscreen, 0

# Move focus with SUPER + arrow keys
unbind = SUPER, left, Move focus left, movefocus, l
unbind = SUPER, right, Move focus right, movefocus, r
unbind = SUPER, up, Move focus up, movefocus, u
unbind = SUPER, down, Move focus down, movefocus, d

bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, l, Move focus right, movefocus, r
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, j, Move focus down, movefocus, d

# MOVE WINDOWS ON CURRENT WORKSPACE

bindd = SUPER SHIFT, h, Move window left, movewindow, l
bindd = SUPER SHIFT, l, Move window right, movewindow, r
bindd = SUPER SHIFT, k, Move window up, movewindow, u
bindd = SUPER SHIFT, j, Move window down, movewindow, d

# RESIZE WINDOWS
bind = SUPER CTRL, h, resizeactive, -40 0
bind = SUPER CTRL, l, resizeactive, 40 0
bind = SUPER CTRL, k, resizeactive, 0 -40
bind = SUPER CTRL, j, resizeactive, 0 40
