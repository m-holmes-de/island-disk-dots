# Catppuccin Mocha Theme for tmux
# Source this file in your main tmux.conf with: source-file ~/.config/tmux/themes/catppuccin-mocha.conf

##
# Color Palette
##

# Catppuccin Mocha - Official Color Palette

# Base colors
BASE="#1e1e2e"
MANTLE="#181825"
CRUST="#11111b"

# Surface colors
SURFACE0="#313244"
SURFACE1="#45475a"
SURFACE2="#585b70"

# Overlay colors
OVERLAY0="#6c7086"
OVERLAY1="#7f849c"
OVERLAY2="#9399b2"

# Text colors
SUBTEXT0="#a6adc8"
SUBTEXT1="#bac2de"
TEXT="#cdd6f4"

# Accent colors (official catppuccin names)
ROSEWATER="#f5e0dc"
FLAMINGO="#f2cdcd"
PINK="#f5c2e7"
MAUVE="#cba6f7"
RED="#f38ba8"
MAROON="#eba0ac"
PEACH="#fab387"
YELLOW="#f9e2af"
GREEN="#a6e3a1"
TEAL="#94e2d5"
SKY="#89dceb"
SAPPHIRE="#74c7ec"
BLUE="#89b4fa"
LAVENDER="#b4befe"

##
# Status Bar Color Palette
##

# Colors for status bar elements (used in tmux.conf)

# Status bar background and default text
TMUX_STATUS_BG="default"  # transparent
TMUX_STATUS_FG="${TEXT}"  # light text for inactive windows

# Active window - use vibrant PEACH (signature catppuccin color)
TMUX_ACTIVE_WINDOW_FG="${PEACH}"

# Session name - use vibrant LAVENDER (signature catppuccin color)
TMUX_SESSION_FG="${LAVENDER}"

# Inactive window - use subtle overlay color
TMUX_INACTIVE_WINDOW_FG="${OVERLAY1}"

# Pane borders - use dark surface for subtle separation (same for both active and inactive)
TMUX_PANE_BORDER="${SURFACE0}"
TMUX_PANE_ACTIVE_BORDER="${SURFACE0}"

# Copy mode (scrollback) highlighting
TMUX_COPY_MODE_BG="${MAUVE}"
TMUX_COPY_MODE_FG="${BASE}"

# Split indicator color
TMUX_SPLIT_INDICATOR_FG="${MAUVE}"
