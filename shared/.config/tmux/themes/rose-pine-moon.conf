# Rose Pine Moon Theme for tmux
# Source this file in your main tmux.conf with: source-file ~/.config/tmux/themes/rose-pine-moon.conf

##
# Color Palette
##

# Rose Pine Moon - Official Color Palette

# Base colors
BASE="#232136"
SURFACE="#2a273f"
OVERLAY="#393552"

# Text colors
TEXT="#e0def4"
SUBTLE="#908caa"
MUTED="#6e6a86"

# Accent colors (official rose-pine names)
LOVE="#eb6f92"
GOLD="#f6c177"
ROSE="#ea9a97"
PINE="#3e8fb0"
FOAM="#9ccfd8"
IRIS="#c4a7e7"

# Highlight colors
HIGHLIGHT_LOW="#2a283e"
HIGHLIGHT_MED="#44415a"
HIGHLIGHT_HIGH="#56526e"

# Legacy aliases for backwards compatibility
RED="${LOVE}"
GREEN="${PINE}"
YELLOW="${GOLD}"
BLUE="${FOAM}"
MAGENTA="${IRIS}"
CYAN="${ROSE}"
BLACK="${BASE}"
DARK_GRAY="${SURFACE}"
LIGHT_GRAY="${OVERLAY}"
BG="${BASE}"
FG="${TEXT}"

##
# Status Bar Color Palette
##

# Colors for status bar elements (used in tmux.conf)
# Using tmux user options (@variable) so they can be referenced in tmux.conf

# Status bar background and default text
set -g @tmux_status_bg "default"
set -g @tmux_status_fg "#e0def4"

# Active window - use soft LOVE red
set -g @tmux_active_window_fg "#eb6f92"

# Session name - use vibrant IRIS purple
set -g @tmux_session_fg "#c4a7e7"

# Inactive window - use subtle muted color
set -g @tmux_inactive_window_fg "#908caa"

# Pane borders - use overlay for visible but subtle separation
set -g @tmux_pane_border "#393552"
set -g @tmux_pane_active_border "#393552"

# Copy mode (scrollback) highlighting
set -g @tmux_copy_mode_bg "#c4a7e7"
set -g @tmux_copy_mode_fg "#232136"

# Split indicator color
set -g @tmux_split_indicator_fg "#c4a7e7"

##
# Apply Theme Colors to tmux
##

# Status bar configuration
set-option -g status-style bg=default,fg=#e0def4

# Window list color styling (format is defined in main tmux.conf)
set-option -g window-status-style fg=#908caa
set-option -g window-status-current-style fg=#eb6f92

# Pane border styling
set-option -g pane-border-style fg=#393552
set-option -g pane-active-border-style fg=#393552

# Copy mode styling
set -g mode-style "fg=#232136,bg=#c4a7e7"
