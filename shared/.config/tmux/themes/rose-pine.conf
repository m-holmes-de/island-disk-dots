# Rose Pine Moon Theme for tmux
# Source this file in your main tmux.conf with: source-file ~/.config/tmux/themes/rose-pine.conf

##
# Color Palette
##

# Rose Pine (main) - Official Color Palette

# Base colors
BASE="#191724"
SURFACE="#1f1d2e"
OVERLAY="#26233a"

# Text colors
TEXT="#e0def4"
SUBTLE="#908caa"
MUTED="#6e6a86"

# Accent colors (official rose-pine names)
LOVE="#eb6f92"
GOLD="#f6c177"
ROSE="#ebbcba"
PINE="#31748f"
FOAM="#9ccfd8"
IRIS="#c4a7e7"

# Highlight colors
HIGHLIGHT_LOW="#21202e"
HIGHLIGHT_MED="#403d52"
HIGHLIGHT_HIGH="#524f67"

# Legacy aliases for backwards compatibility
RED="${LOVE}"
GREEN="${PINE}"
YELLOW="${GOLD}"
BLUE="${FOAM}"
MAGENTA="${IRIS}"
CYAN="${ROSE}"
BLACK="${BASE}"
DARK_GRAY="${SURFACE}"
LIGHT_GRAY="${OVERLAY}"
BG="${BASE}"
FG="${TEXT}"

##
# Nerd Font Icons
##

HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"
SLANT_LEFT="#(printf '\ue0bc')"
SLANT_RIGHT="#(printf '\ue0be')"
BLANK_SEPARATOR="#(printf '\u2588')"

# Icons
INACTIVE_WINDOW_ICON="#(printf '\uf1db')"
ACTIVE_WINDOW_ICON="#(printf '\uf192')"
SPLIT_INDICATOR_ICON="#(printf '\uebf1')"
GIT_ICON="#(printf '\ue0a0')"
CPU_ICON="#(printf '\uf4bc')"
RAM_ICON="#(printf '\uefc5')"
ZAP_ICON="#(printf '\uf0e7')"

##
# Status Bar Styling
##

# Basic colors of the Statusbar
set-option -g status-style bg=default,fg=${FG} # transparent background

# Show the window list centered between the left and the right section
set-option -g status-justify centre

# Style and set contents on the left section
set-option -g status-left "\
#[bg=${ROSE},fg=${BLACK}] #S \
#[fg=${ROSE},bg=${OVERLAY}]${SLANT_LEFT}\
#[bg=${OVERLAY},fg=${LOVE}] ${CPU_ICON} #[fg=${FG}]#(~/.config/tmux/scripts/cpu.sh | awk '{printf \"%-4s\", $0}') \
#[fg=${GREEN}]${RAM_ICON} #[fg=${FG}]#(~/.config/tmux/scripts/ram.sh | awk '{printf \"%-4s\", $0}') \
#[fg=${OVERLAY},bg=default]${SLANT_LEFT} \
"

# Style and set contents on the right section
set-option -g status-right "\
#[fg=${GOLD},bg=default]#{?client_prefix,${ZAP_ICON}  ,   }\
#[fg=${OVERLAY},bg=default]${SLANT_RIGHT}\
#[bg=${OVERLAY},fg=${IRIS}] #{?#{>:#{window_panes},1},${SPLIT_INDICATOR_ICON}  ,   }\
#[fg=${ROSE},bg=${OVERLAY}]${SLANT_RIGHT}\
#[bg=${ROSE},fg=${BLACK}] #{?#{SSH_TTY},SSH: ,}#h \
"

# Set max length of left and right section
set-option -g status-left-length 100
set-option -g status-right-length 100

# Style and set content for the inactive windows
set-option -g window-status-format "\
#[fg=${GREEN}]${INACTIVE_WINDOW_ICON} #[fg=${FG}]#W \
"

# Style and set content for the active windows
set-option -g window-status-current-format "\
#[fg=${ROSE}]${ACTIVE_WINDOW_ICON} #[fg=${TEXT}]#W \
"

# Remove the separator between window list items, as we already have spacing
# "around" inactive items
set-option -g window-status-separator ""
