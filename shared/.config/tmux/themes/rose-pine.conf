# Rose Pine Moon Theme for tmux
# Source this file in your main tmux.conf with: source-file ~/.config/tmux/themes/rose-pine.conf

##
# Color Palette
##

# Rose Pine (main) - Official Color Palette

# Base colors
BASE="#191724"
SURFACE="#1f1d2e"
OVERLAY="#26233a"

# Text colors
TEXT="#e0def4"
SUBTLE="#908caa"
MUTED="#6e6a86"

# Accent colors (official rose-pine names)
LOVE="#eb6f92"
GOLD="#f6c177"
ROSE="#ebbcba"
PINE="#31748f"
FOAM="#9ccfd8"
IRIS="#c4a7e7"

# Highlight colors
HIGHLIGHT_LOW="#21202e"
HIGHLIGHT_MED="#403d52"
HIGHLIGHT_HIGH="#524f67"

# Legacy aliases for backwards compatibility
RED="${LOVE}"
GREEN="${PINE}"
YELLOW="${GOLD}"
BLUE="${FOAM}"
MAGENTA="${IRIS}"
CYAN="${ROSE}"
BLACK="${BASE}"
DARK_GRAY="${SURFACE}"
LIGHT_GRAY="${OVERLAY}"
BG="${BASE}"
FG="${TEXT}"

##
# Nerd Font Icons
##

HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"
SLANT_LEFT="#(printf '\ue0bc')"
SLANT_RIGHT="#(printf '\ue0be')"
BLANK_SEPARATOR="#(printf '\u2588')"

# Icons (keeping separators for potential future use)
# All window icons removed for minimal clean look

##
# Status Bar Color Palette
##

# Colors for status bar elements (used in tmux.conf)
# Use more exciting colors from the Rose Pine palette

# Status bar background and default text
TMUX_STATUS_BG="default"  # transparent
TMUX_STATUS_FG="${TEXT}"  # white text for inactive windows

# Active window - use soft LOVE red
TMUX_ACTIVE_WINDOW_FG="${LOVE}"

# Session name - use vibrant IRIS purple
TMUX_SESSION_FG="${IRIS}"

# Inactive window - use subtle muted color
TMUX_INACTIVE_WINDOW_FG="${SUBTLE}"

# Pane borders - use dark grey for subtle separation (same for both active and inactive)
TMUX_PANE_BORDER="${SURFACE}"
TMUX_PANE_ACTIVE_BORDER="${SURFACE}"
