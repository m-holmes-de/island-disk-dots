# If installing on a new system, remember to install tpm

# To install tpm and other plugins run '''prefix I''' so capital I

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename-format "#{pane_current_command}"

# Get images to work in yazi
set -g allow-passthrough on
set -s set-clipboard on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Pane resizing with arrow keys (prefix + arrows)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Pane resizing with vim keys (prefix + hjkl)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Use VIM Binds in Copy Mode
setw -g mode-keys vi

set -g status-position top # set bar position

# Load theme (colors only)
source-file ~/.config/tmux/themes/rose-pine.conf

# Status bar configuration
set-option -g status-style bg=${TMUX_STATUS_BG},fg=${TMUX_STATUS_FG}
set-option -g status-justify left

# Left section (empty for clean look)
set-option -g status-left ""

# Right section (session name)
set-option -g status-right "#[fg=${TMUX_SESSION_FG},bg=default] #S "

# Max length
set-option -g status-left-length 100
set-option -g status-right-length 100

# Window list styling
set-option -g window-status-format "#[fg=${TMUX_INACTIVE_WINDOW_FG}]#W "
set-option -g window-status-current-format "#[fg=${TMUX_ACTIVE_WINDOW_FG}]#W "
set-option -g window-status-separator ""

# Pane border styling
set-option -g pane-border-style fg=${TMUX_PANE_BORDER}
set-option -g pane-active-border-style fg=${TMUX_PANE_ACTIVE_BORDER}

# Utils
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

bind '"' split-window -v -f -p 35 -c "#{pane_current_path}"
bind % split-window -h -f -p 35 -c "#{pane_current_path}"

# Explicitly unbind m and n to avoid plugin conflicts
unbind m
unbind n
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g display-popup -E -w 80% -h 80% "lazygit"
# Persistent floating terminal per session (toggle with prefix + t)
bind-key t if-shell -F '#{m:*-popup,#{session_name}}' { detach-client } { run-shell 'tmux display-popup -E -w 80% -h 80% "tmux attach -t $(tmux display -p \"#S\")-popup 2>/dev/null || tmux new -s $(tmux display -p \"#S\")-popup"' }
