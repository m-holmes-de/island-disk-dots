# If installing on a new system, remember to install tpm

# To install tpm and other plugins run '''prefix I''' so capital I

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename-format "#{pane_current_command}"

# Get images to work in yazi
set -g allow-passthrough on
set -s set-clipboard on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Pane resizing with arrow keys (prefix + arrows)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Pane resizing with vim keys (prefix + jkl only, h is used for history)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Pane swapping with vim keys (prefix + Shift+hjkl)
bind -r H swap-pane -U
bind -r J swap-pane -D
bind -r K swap-pane -U
bind -r L swap-pane -D

# Easy access to copy mode (history/scrollback)
bind h copy-mode

# Use VIM Binds in Copy Mode
setw -g mode-keys vi

# Copy mode styling (defined in theme file)

# Copy mode vim-style selection and yanking
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Increase scrollback buffer
set -g history-limit 50000

# Native-like mouse scrolling
# Automatically enter copy mode when scrolling up
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Faster scrolling in copy mode (5 lines at a time like native terminal)
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# Exit copy mode when scrolling to bottom
set -g @scroll-speed-num-lines-per-scroll 5

set -g status-position top # set bar position

# Load theme (colors only)
source-file ~/.config/tmux/themes/rose-pine-moon.conf
# Alternative themes:
# source-file ~/.config/tmux/themes/rose-pine.conf
# source-file ~/.config/tmux/themes/catppuccin-mocha.conf

# Status bar configuration (colors set in theme file)
set-option -g status-justify left

# Left section (empty for clean look)
set-option -g status-left ""

# Right section (split indicator + session name)
SPLIT_INDICATOR_ICON="#(printf '\uebf1')"
set-option -g status-right "#[fg=#{@tmux_split_indicator_fg},bg=default]#{?#{>:#{window_panes},1},${SPLIT_INDICATOR_ICON} ,}#[fg=#{@tmux_session_fg},bg=default]#S"

# Max length
set-option -g status-left-length 100
set-option -g status-right-length 100

# Window status separator
set-option -g window-status-separator ""

# Utils
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

bind '"' split-window -v -f -p 35 -c "#{pane_current_path}"
bind % split-window -h -f -p 35 -c "#{pane_current_path}"

# Explicitly unbind keys to avoid conflicts
unbind m
unbind n
unbind t
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
# Smart lazygit: jump to window 5 or create it
bind-key g if-shell "tmux select-window -t :5 2>/dev/null" "" "new-window -t :5 -n 'git' 'lazygit'"
# Smart yazi: jump to window 4 or create it
bind-key y if-shell "tmux select-window -t :4 2>/dev/null" "" "new-window -t :4 -n 'yazi' 'yazi'"

# Auto-setup windows for new sessions
set-hook -g session-created 'run-shell ~/.config/tmux/scripts/setup-session.sh'
