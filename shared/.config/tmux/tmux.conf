# If installing on a new system, remember to install tpm

# To install tpm and other plugins run '''prefix I''' so capital I

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename-format "#{b:pane_current_path}"

# Get images to work in yazi
set -g allow-passthrough on
set -s set-clipboard on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Pane resizing with arrow keys (prefix + arrows)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Pane resizing with vim keys (prefix + hjkl)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Use VIM Binds in Copy Mode
setw -g mode-keys vi

set -g status-position top # set bar position

##
# Styling
##


# catppuccin-mocha colorscheme (matching Ghostty theme)
# RED="#f38ba8"
# GREEN="#a6e3a1"
# YELLOW="#f9e2af"
# BLUE="#89b4fa"
# MAGENTA="#f5c2e7" # PINK
# CYAN="#94e2d5" # TEAL
# BLACK="#11111b"
# DARK_GRAY="#1e1e2e" # BASE
# LIGHT_GRAY="#585b70" # SURFACE 2
# BG="#24273a" # Match Ghostty custom background
# FG="#cdd6f4"

# catppuccin-frappe colorscheme
# RED="#e78284"
# GREEN="#a6d189"
# YELLOW="#e5c890"
# BLUE="#8caaee"
# MAGENTA="f4b8e4" # PINK
# CYAN="#81c8be" # TEAL
# BLACK="#1d2021"
# DARK_GRAY="#303446" # BASE
# LIGHT_GRAY="#626880" # SURFACE 2
# BG="#292c3c"
# FG="#c6d0f5"

# rose-pine-moon colorscheme
RED="#eb6f92"      # Love
GREEN="#3e8fb0"    # Pine
YELLOW="#f6c177"   # Gold
BLUE="#9ccfd8"     # Foam
MAGENTA="#c4a7e7"  # Iris
CYAN="#ea9a97"     # Rose
BLACK="#232136"    # Base
DARK_GRAY="#2a273f" # Surface
LIGHT_GRAY="#393552" # Overlay
BG="#232136"
FG="#e0def4"

# Nerdfont characters
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"
SLANT_LEFT="#(printf '\ue0bc')"
SLANT_RIGHT="#(printf '\ue0be')"
# BLANK_SEPARATOR="█"
BLANK_SEPARATOR="#(printf '\u2588')"
INACTIVE_WINDOW_ICON="#(printf '\uf1db')"
ACTIVE_WINDOW_ICON="#(printf '\uf192')"
SPLIT_INDICATOR_ICON="#(printf '\uebf1')"

# Uncomment to move statusbar to the top
# set-option -g status-position top

# Basic colors of the Statusbar
set-option -g status-style bg=${BLACK},fg=${FG} # darker background
# set-option -g status-style bg=${DARK_GRAY},fg=${FG} # subtle background
# set-option -g status-style bg=default,fg=${FG} # transparent background
# set-option -g status-style bg=#191724,fg=${FG}

# Show the window list centered between the left and the right section
set-option -g status-justify left

# Style and set contents on the left section
set-option -g status-left "\
#[fg=${LIGHT_GRAY},bg=${BG}]${BLANK_SEPARATOR}\
#[bg=${LIGHT_GRAY},fg=${MAGENTA}]#S\
#[fg=${LIGHT_GRAY},bg=default]${BLANK_SEPARATOR}${SLANT_LEFT}\
"

# Style and set contents on the right section
set-option -g status-right "\
#[fg=${MAGENTA},bg=default]#{?#{>:#{window_panes},1},${SPLIT_INDICATOR_ICON} ,}\
#[fg=${LIGHT_GRAY},bg=default]${SLANT_RIGHT}${BLANK_SEPARATOR}\
#[bg=${LIGHT_GRAY},fg=${MAGENTA}]#{?#{SSH_TTY},SSH: ,}#h\
#[fg=${LIGHT_GRAY},bg=default]${BLANK_SEPARATOR}\
"

# Set max length of left and right section
set-option -g status-left-length 100
set-option -g status-right-length 100

# Style and set content for the inactive windows
set-option -g window-status-format "\
#[fg=${MAGENTA}]${INACTIVE_WINDOW_ICON} #[fg=${FG}]#W \
"

# Style and set content for the active windows
set-option -g window-status-current-format "\
#[fg=${MAGENTA}]${ACTIVE_WINDOW_ICON} #[fg=${MAGENTA},underscore]#W#[none] \
"

# Remove the separator between window list items, as we already have spacing
# "around" inactive items
set-option -g window-status-separator ""
# Get tmux-continuum restoring automatically

# Utils
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

# Rebind default splits to 25% size
bind '"' split-window -v -p 25 -c "#{pane_current_path}"
bind % split-window -h -p 25 -c "#{pane_current_path}"

# Explicitly unbind m and n to avoid plugin conflicts
unbind m
unbind n
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g display-popup -E -w 80% -h 80% "lazygit"
bind-key k display-popup -E -w 70% -h 70% "~/.config/tmux/shortcuts-parser.sh | fzf --no-sort --layout=reverse --header='Shortcuts'"
# Persistent floating terminal per session (toggle with prefix + t)
bind-key t if-shell -F '#{m:*-popup,#{session_name}}' { detach-client } { run-shell 'tmux display-popup -E -w 80% -h 80% "tmux attach -t $(tmux display -p \"#S\")-popup 2>/dev/null || tmux new -s $(tmux display -p \"#S\")-popup"' }
