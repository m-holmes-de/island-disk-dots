# vim:fileencoding=utf-8:foldmethod=marker
# One Dark Pro Theme for Yazi

# : Manager {{{

[mgr]
cwd = { fg = "#56b6c2" }

# Hovered
hovered = { reversed = true }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#e5c07b", bold = true, italic = true, underline = true }
find_position = { fg = "#c678dd", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#61afef", bg = "#61afef" }
marker_cut = { fg = "#e06c75", bg = "#e06c75" }
marker_marked = { fg = "#e5c07b", bg = "#e5c07b" }
marker_selected = { fg = "#98c379", bg = "#98c379" }

# Count
count_copied = { fg = "#abb2bf", bg = "#61afef" }
count_cut = { fg = "#abb2bf", bg = "#e06c75" }
count_selected = { fg = "#282c34", bg = "#98c379" }

# Border
border_symbol = "│"
border_style = { fg = "#3e4451" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#282c34", bg = "#61afef", bold = true }
inactive = { fg = "#5c6370", bg = "#3e4451" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#282c34", bg = "#56b6c2", bold = true }
normal_alt = { fg = "#282c34", bg = "#abb2bf", bold = true }

# Select mode
select_main = { fg = "#282c34", bg = "#c678dd", bold = true }
select_alt = { fg = "#282c34", bg = "#abb2bf", bold = true }

# Unset mode
unset_main = { fg = "#282c34", bg = "#e06c75", bold = true }
unset_alt = { fg = "#282c34", bg = "#abb2bf", bold = true }

# : }}}


# : Status bar {{{

[status]
overall = { bg = "#282c34" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#5c6370" }
perm_type = { fg = "#c678dd" }
perm_read = { fg = "#e5c07b" }
perm_write = { fg = "#e06c75" }
perm_exec = { fg = "#98c379" }

# Progress
progress_label = { fg = "#abb2bf", bold = true }
progress_normal = { fg = "#61afef", bg = "#2c313c" }
progress_error = { fg = "#e06c75", bg = "#2c313c" }

# : }}}


# : Which {{{

[which]
cols = 3
mask = { bg = "#2c313c" }
cand = { fg = "#56b6c2" }
rest = { fg = "#5c6370" }
desc = { fg = "#e5c07b" }
separator = "  "
separator_style = { fg = "#5c6370" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#3e4451" }
title = { fg = "#e06c75", bold = true }
body = { fg = "#abb2bf" }
list = { fg = "#abb2bf" }
btn_yes = { fg = "#282c34", bg = "#98c379", bold = true }
btn_no = { fg = "#282c34", bg = "#abb2bf", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#3e4451" }
title = { fg = "#56b6c2", bold = true }

# Table
tbl_col = { fg = "#56b6c2" }
tbl_cell = { fg = "#282c34", bg = "#e5c07b", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#61afef" }
title_warn = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }


# : }}}


# : Picker {{{

[pick]
border = { fg = "#61afef" }
active = { fg = "#c678dd", bold = true }
inactive = { fg = "#5c6370" }

# : }}}


# : Input {{{

[input]
border = { fg = "#61afef" }
title = { bold = true }
value = { fg = "#abb2bf" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#61afef" }
active = { bg = "#61afef", fg = "#282c34", bold = true }
inactive = { fg = "#5c6370" }


# : }}}


# : Task manager {{{

[tasks]
border = { fg = "#61afef" }
title = { bold = true }
hovered = { fg = "#c678dd", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on = { fg = "#56b6c2" }
run = { fg = "#c678dd" }
desc = { fg = "#e5c07b" }
hovered = { reversed = true, bold = true }
footer = { fg = "#282c34", bg = "#abb2bf" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#c678dd" },

  # Media
  { mime = "{audio,video}/*", fg = "#e5c07b" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e06c75" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#d19a66" },

  # Empty files
  # { mime = "inode/empty", fg = "#e06c75" },

  # Special files
  { name = "*", is = "orphan", fg = "#282c34", bg = "#e06c75" },
  { name = "*", is = "exec", fg = "#98c379" },

  # Dummy files
  { name = "*", is = "dummy", fg = "#282c34", bg = "#e06c75" },
  { name = "*/", is = "dummy", fg = "#282c34", bg = "#e06c75" },

  # Fallback
  { name = "*", fg = "#abb2bf" },
  { name = "*/", fg = "#61afef" },
]

# : }}}
