# OneDark Pro Theme for tmux
# Source this file in your main tmux.conf with: source-file ~/.config/tmux/themes/onedark-pro.conf

##
# Color Palette
##

# OneDark Pro - Official Color Palette

# Base colors
BASE="#282c34"
SURFACE="#21252b"
OVERLAY="#3e4451"

# Text colors
TEXT="#abb2bf"
SUBTLE="#5c6370"
MUTED="#4b5263"

# Accent colors (semantic names)
RED="#e06c75"
GREEN="#98c379"
YELLOW="#e5c07b"
BLUE="#61afef"
MAGENTA="#c678dd"
CYAN="#56b6c2"

# Highlight colors
HIGHLIGHT_LOW="#2c313c"
HIGHLIGHT_MED="#3e4451"
HIGHLIGHT_HIGH="#4b5263"

# Legacy aliases for backwards compatibility
BLACK="${BASE}"
DARK_GRAY="${SURFACE}"
LIGHT_GRAY="${OVERLAY}"
BG="${BASE}"
FG="${TEXT}"

##
# Status Bar Color Palette
##

# Colors for status bar elements (used in tmux.conf)
# Using tmux user options (@variable) so they can be referenced in tmux.conf

# Status bar background and default text
set -g @tmux_status_bg "default"
set -g @tmux_status_fg "#abb2bf"

# Active window - use vibrant blue
set -g @tmux_active_window_fg "#61afef"

# Session name - use magenta/purple
set -g @tmux_session_fg "#c678dd"

# Inactive window - use subtle muted color
set -g @tmux_inactive_window_fg "#5c6370"

# Pane borders - use overlay for visible but subtle separation
set -g @tmux_pane_border "#3e4451"
set -g @tmux_pane_active_border "#3e4451"

# Copy mode (scrollback) highlighting
set -g @tmux_copy_mode_bg "#61afef"
set -g @tmux_copy_mode_fg "#282c34"

# Split indicator color
set -g @tmux_split_indicator_fg "#c678dd"

##
# Apply Theme Colors to tmux
##

# Status bar configuration
set-option -g status-style bg=default,fg=#abb2bf

# Window list color styling (format is defined in main tmux.conf)
set-option -g window-status-style fg=#5c6370
set-option -g window-status-current-style fg=#61afef

# Pane border styling
set-option -g pane-border-style fg=#3e4451
set-option -g pane-active-border-style fg=#3e4451

# Copy mode styling
set -g mode-style "fg=#282c34,bg=#61afef"
